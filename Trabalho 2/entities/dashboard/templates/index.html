<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Produção</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Dashboard de Produção</h1>

        <h2>Linhas de Produção - Fábrica 1</h2>
        <div id="lines-grid" class="lines-container"></div>

        <h2>Estoque de Produtos Acabados</h2>
        <div id="finished-goods-grid" class="grid-container"></div>

        <h2>Status do Almoxarifado</h2>
        <div id="inventory-summary" class="inventory-summary-container"></div>
        <div id="inventory-grid" class="grid-container"></div>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log('Conectado ao servidor de dashboard!');
        });

        // Recebe o estado inicial completo
        socket.on('initial_state', (data) => {
            console.log('Estado inicial recebido');
            const inventoryGrid = document.getElementById('inventory-grid');
            inventoryGrid.innerHTML = '';
            for (const partName in data.inventory) {
                const part = data.inventory[partName];
                inventoryGrid.innerHTML += `
                    <div id="part-${partName}" class="grid-item status-${part.status}">
                        <div class="part-name">${partName}</div>
                        <div class="part-quantity">${part.quantity}/100</div>
                    </div>
                `;
            }

            const linesGrid = document.getElementById('lines-grid');
            linesGrid.innerHTML = '';
            // Ordena as linhas para uma exibição consistente
            const sortedLineIds = Object.keys(data.lines).sort();
            for (const lineId of sortedLineIds) {
                 const line = data.lines[lineId];
                 const percentage = (line.completed / line.total) * 100;
                 linesGrid.innerHTML += `
                    <div id="line-${lineId}" class="line-item">
                        <h3>Linha ${lineId}</h3>
                        <p>Produto: <strong id="line-prod-${lineId}">${line.product_id}</strong></p>
                        <div class="progress-bar">
                            <div id="line-progress-${lineId}" class="progress-bar-fill" style="width: ${percentage}%">${Math.round(percentage)}%</div>
                        </div>
                        <p class="line-progress-text" id="line-count-${lineId}">${line.completed} / ${line.total} unidades</p>
                        <p class="line-status" id="line-status-${lineId}">Status: ${line.status_text}</p>
                    </div>
                `;
            }

            const finishedGoodsGrid = document.getElementById('finished-goods-grid');
            finishedGoodsGrid.innerHTML = '';
            const sortedProductIds = Object.keys(data.finished_goods).sort();
            for (const productId of sortedProductIds) {
                const product = data.finished_goods[productId];
                finishedGoodsGrid.innerHTML += `
                    <div id="product-${productId}" class="grid-item status-${product.status}">
                        <div class="part-name">${productId}</div>
                        <div class="part-quantity">${product.current}/${product.target}</div>
                        <div class="product-sold">Vendidos: ${product.sold}</div>
                    </div>
                `;
            }
        });

        // Recebe atualizações individuais
        socket.on('inventory_update', (data) => {
            const partElement = document.getElementById(`part-${data.part_name}`);
            if (partElement) {
                partElement.className = `grid-item status-${data.status}`;
                partElement.querySelector('.part-quantity').textContent = `${data.quantity}/100`;
            }
        });

        socket.on('line_update', (data) => {
            const lineElement = document.getElementById(`line-${data.line_id}`);
            if (lineElement) {
                document.getElementById(`line-prod-${data.line_id}`).textContent = data.product_id;
                document.getElementById(`line-count-${data.line_id}`).textContent = `${data.completed} / ${data.total} unidades`;
                document.getElementById(`line-status-${data.line_id}`).textContent = `Status: ${data.status_text}`;
                const progressFill = document.getElementById(`line-progress-${data.line_id}`);
                const percentage = (data.completed / data.total) * 100;
                progressFill.style.width = `${percentage}%`;
                progressFill.textContent = `${Math.round(percentage)}%`;
            }
        });

        socket.on('inventory_summary_update', (counts) => {
            const summaryContainer = document.getElementById('inventory-summary');
            if (summaryContainer) {
                summaryContainer.innerHTML = `
                    <div class="summary-box summary-VERDE">Verde: ${counts.VERDE}</div>
                    <div class="summary-box summary-AMARELO">Amarelo: ${counts.AMARELO}</div>
                    <div class="summary-box summary-VERMELHO">Vermelho: ${counts.VERMELHO}</div>
                `;
            }
        });

        socket.on('finished_goods_update', (data) => {
            let productElement = document.getElementById(`product-${data.product_id}`);
            const grid = document.getElementById('finished-goods-grid');

            // Se o elemento não existir, cria e adiciona ao grid
            if (!productElement && grid) {
                const newElement = document.createElement('div');
                newElement.id = `product-${data.product_id}`;
                grid.appendChild(newElement);
                productElement = newElement;
            }

            if (productElement) {
                productElement.className = `grid-item status-${data.status}`;
                productElement.innerHTML = `
                    <div class="part-name">${data.product_id}</div>
                    <div class="part-quantity">${data.current}/${data.target}</div>
                    <div class="product-sold">Vendidos: ${data.sold}</div>
                `;
            }
        });
    </script>
</body>
</html>
